<div class="app">
  <header>
    <div class="brand">
      <h1>Redrawn</h1>
      <p class="sub">Territory seized, populations displaced, populations confined &mdash; from the earliest record to the present</p>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewSeg">
      <button data-view="map" aria-pressed="true">Map</button>
      <button data-view="charts" aria-pressed="false">Charts</button>
      <button data-view="table" aria-pressed="false">Table</button>
    </div>
    <button class="btn" id="shareBtn" title="Copy a link that restores this exact view">Copy link</button>
    <button class="btn" id="aboutBtn">About &amp; method</button>
    <button class="btn" id="themeBtn">Light</button>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="dd" data-dd="type">
      <button class="ddbtn" aria-expanded="false"><span class="lab">Type</span><span class="cnt"></span><span class="car">&#9662;</span></button>
      <div class="pop" hidden><div class="popbody"></div><div class="popfoot"><button data-act="all">Select all</button><button data-act="none">Clear</button></div></div>
    </div>
    <div class="dd" data-dd="region">
      <button class="ddbtn" aria-expanded="false"><span class="lab">Region</span><span class="cnt"></span><span class="car">&#9662;</span></button>
      <div class="pop" hidden><div class="popbody"></div><div class="popfoot"><button data-act="all">Select all</button><button data-act="none">Clear</button></div></div>
    </div>
    <div class="dd" data-dd="violence">
      <button class="ddbtn" aria-expanded="false"><span class="lab">Violence</span><span class="cnt"></span><span class="car">&#9662;</span></button>
      <div class="pop" hidden><div class="popbody"></div><div class="popfoot"><button data-act="none">Clear</button></div></div>
    </div>
    <div class="dd" data-dd="evidence">
      <button class="ddbtn" aria-expanded="false"><span class="lab">Evidence</span><span class="cnt"></span><span class="car">&#9662;</span></button>
      <div class="pop" hidden><div class="popbody"></div><div class="popfoot"><button data-act="none">Clear</button></div></div>
    </div>
    <div class="dd" data-dd="display">
      <button class="ddbtn" aria-expanded="false"><span class="lab">Display</span><span class="cnt"></span><span class="car">&#9662;</span></button>
      <div class="pop" hidden><div class="popbody"></div></div>
    </div>
    <label class="searchwrap">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="Search events, actors, places&hellip;" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="qres">
      <div class="qres" id="qres" hidden role="listbox"></div>
    </label>
    <span class="spacer"></span>
    <span class="resultcount" id="resultCount"></span>
    <button class="btn" id="resetBtn" hidden>Reset filters</button>
  </div>

  <main id="mainStage">
    <div class="stage" id="stage">
      <svg id="map"></svg>
      <div class="hud hud-tl" id="hudTL"></div>
      <div class="hud hud-tr"><div class="card totals" id="totals"></div></div>
      <div class="legend card">
        <h4>Legend</h4>
        <div class="row"><span class="key"><svg width="13" height="13"><circle cx="6.5" cy="6.5" r="5" fill="var(--s1)" fill-opacity=".45" stroke="var(--s1)" stroke-width="1.5"/></svg></span> Forced displacement</div>
        <div class="row"><span class="key"><svg width="13" height="13"><rect x="1.5" y="1.5" width="10" height="10" rx="2" fill="var(--s2)" fill-opacity=".45" stroke="var(--s2)" stroke-width="1.5"/></svg></span> Territory seized</div>
        <div class="row"><span class="key"><svg width="13" height="13"><rect x="2" y="2" width="9" height="9" rx="1.5" transform="rotate(45 6.5 6.5)" fill="var(--s3)" fill-opacity=".45" stroke="var(--s3)" stroke-width="1.5"/></svg></span> Both</div>
        <div class="row"><span class="key"><svg width="13" height="13"><circle cx="6.5" cy="6.5" r="5" fill="var(--s4)" fill-opacity=".12" stroke="var(--s4)" stroke-width="1.4" stroke-dasharray="3 2.5"/><circle cx="6.5" cy="6.5" r="1.6" fill="var(--s4)"/></svg></span> Confined in place</div>
        <div class="row" id="legAtro" hidden><span class="key"><svg width="15" height="15"><circle cx="7.5" cy="7.5" r="6.2" fill="none" stroke="var(--crit)" stroke-width="1.6"/><path d="M5 5 L10 10 M10 5 L5 10" stroke="var(--crit)" stroke-width="1.6"/></svg></span> Mass killing was the defining act</div>
        <div class="row" style="margin-top:7px"><span class="key"><svg width="20" height="9"><path d="M1 7 Q10 -2 19 4" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round"/></svg></span> Population flow</div>
        <div class="row" id="legFlowCap" hidden style="color:var(--muted);font-size:10.5px;line-height:1.35;display:block;margin-top:6px"></div>
        <div class="sizekey">
          <svg width="66" height="28"><circle cx="8" cy="21" r="4" fill="none" stroke="var(--muted)"/><circle cx="26" cy="17" r="8" fill="none" stroke="var(--muted)"/><circle cx="50" cy="13" r="12" fill="none" stroke="var(--muted)"/></svg>
          <span style="padding-bottom:2px" id="legSize">Scale of the event<br>(people, or km&sup2;)</span>
        </div>
      </div>
      <div class="ctl">
        <button id="globeBtn" title="Switch between globe and flat map" aria-pressed="false">&#9673;</button>
        <button id="zin" title="Zoom in">+</button>
        <button id="zout" title="Zoom out">&minus;</button>
        <button id="zreset" title="Reset view" style="font-size:12px">&#8634;</button>
      </div>
      <div class="tip" id="tip"></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>

  <div class="timeline" id="timeline">
    <div class="trow">
      <button class="play" id="play" title="Sweep the window forward">&#9654;</button>
      <div class="winbox">
        <div class="w" id="winLabel">&nbsp;</div>
        <div class="c" id="winCount">&nbsp;</div>
      </div>
      <div class="track"><svg id="tl"></svg></div>
      <div class="speed" id="speed">
        <button data-ms="620" aria-pressed="false">1&times;</button>
        <button data-ms="330" aria-pressed="true">2&times;</button>
        <button data-ms="150" aria-pressed="false">4&times;</button>
      </div>
      <button class="btn" id="allTime" title="Show the whole record">All time</button>
    </div>
  </div>

  <section class="sheet" id="charts" hidden></section>
  <section class="sheet" id="table" hidden></section>
</div>
