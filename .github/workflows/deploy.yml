# Build Redrawn and publish it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then every push to main republishes the site.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_url is e.g. https://user.github.io/Repo — SITE_URL is used for
      # canonical links, the sitemap and social tags; BASE_PATH makes every
      # internal link work from the /Repo/ subdirectory.
      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 build_site.py

      - name: Check the build
        run: |
          test -f dist/index.html
          test -f dist/assets/events.json
          n=$(ls dist/events/*.html | wc -l)
          echo "built $n event pages"
          test "$n" -gt 500

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
